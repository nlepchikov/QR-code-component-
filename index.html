<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap"
      rel="stylesheet"/>
    <link rel="stylesheet" href="styles.css" />
    <title>Frontend Mentor | QR code component</title>
  </head>
  <body>
    <section class="qr-code-component">
      <div class="qr-code-component-card">
        <img
          src="./qr-code-component-main/images/image-qr-code.png"
          alt="QR code"
          class="qr-code-component-image"
        />
        <div class="qr-code-component-text">
          <h1 class="qr-code-component-title">
            Improve your front-end skills by building projects
          </h1>
          <p class="qr-code-component-description">
            Scan the QR code to visit Frontend Mentor and take your coding
            skills to the next level
          </p>
        </div>
      </div>
    </section>
  </body>
</html>
